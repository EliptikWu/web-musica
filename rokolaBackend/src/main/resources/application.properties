spring.application.name=rokolaBackend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,flyway
management.endpoint.health.show-details=always

rokola.device-hmac-secret=${ROKOLA_DEVICE_HMAC_SECRET}
rokola.qr-base-url=${ROKOLA_QR_BASE_URL:}
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.busquedas.max-diarias=80
